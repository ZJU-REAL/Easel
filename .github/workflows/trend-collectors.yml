name: 自定义数据源

on:
  push:
    paths:
      - 'easel/trends/**'
      - 'easel/timeouts.py'
      - 'web/app.py'
      - 'web/frontend/**'
      - 'tests/test_trend*.py'
      - 'tests/frontend/**'
      - '.github/workflows/trend-collectors.yml'
  pull_request:
    paths:
      - 'easel/trends/**'
      - 'easel/timeouts.py'
      - 'web/app.py'
      - 'web/frontend/**'
      - 'tests/test_trend*.py'
      - 'tests/frontend/**'
      - '.github/workflows/trend-collectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: 数据源 (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装数据源测试依赖
        run: python -m pip install pytest fastapi httpx uvicorn sse-starlette python-multipart requests websocket-client cryptography
      - name: 校验协议、文件导入与跨平台进程边界
        run: python -m pytest -q tests/test_trends.py tests/test_trend_collectors.py tests/test_trend_rss.py tests/test_trend_defense.py tests/test_trend_uploads.py tests/test_trend_portability.py tests/test_trend_live_examples.py

  frontend:
    name: 数据源前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test ../../tests/frontend/*.test.mjs
      - run: npm run build
