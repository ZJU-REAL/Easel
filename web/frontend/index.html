<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 子路径代理下必须带结尾斜杠，否则相对资源路径(./assets)会解析到上一级 → 404 白屏。
      // 若当前路径无结尾斜杠且末段不像文件名(无扩展名)，自动补斜杠后重载。
      (function () {
        var p = location.pathname;
        var last = p.split('/').pop();
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(last)) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="./static/easel-icon-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Easel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
